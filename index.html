<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astra">
<meta name="theme-color" content="#04060a">
<link rel="manifest" href="manifest.json">
<link id="ic" rel="apple-touch-icon">
<title>ASTRA · Dr. Guhan Ramamurthy</title>
<style>
:root{
  --bg:#04060a; --ink:#f4efe8; --mut:#9a9186; --faint:#5f594f;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.028);
  --amber:#ffdeba; --red:#ff7a6b; --teal:#7fe0d0; --violet:#b9a6ff;
  --gold:#ffc86a; --bone:#e8e2d8; --grn:#7fe0a8;
  --ac:var(--amber); --ac2:176,196,255;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative}

/* ══ the sky: photographic plate, procedural canvas, grade, grain ══ */
#plate,#plate2{position:fixed;inset:0;z-index:0;background:#04060a center/cover no-repeat;
  opacity:0;transition:opacity 1.05s cubic-bezier(.4,0,.2,1)}
#plate2{z-index:0}
#plate.on,#plate2.on{opacity:1}
#sky{position:fixed;inset:0;z-index:1;width:100%;height:100%;opacity:.95}
#grade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
   linear-gradient(180deg,rgba(4,6,10,.93) 0%,rgba(4,6,10,.48) 20%,rgba(4,6,10,.14) 42%,rgba(4,6,10,.30) 62%,rgba(4,6,10,.84) 84%,rgba(4,6,10,.97) 100%),
   radial-gradient(105% 52% at 10% 6%,rgba(4,6,10,.80) 0%,rgba(4,6,10,0) 64%)}
#grain{position:fixed;inset:-50%;z-index:3;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
  animation:grain 1.1s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
.bar{position:fixed;left:0;right:0;height:env(safe-area-inset-top);background:#000;z-index:40}
.bar.b{top:auto;bottom:0;height:env(safe-area-inset-bottom)}

/* ══ header ══ */
header{position:relative;z-index:20;flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 15px 0}
.hrow{display:flex;align-items:center;gap:12px}
#orbBox{position:relative;width:52px;height:52px;flex:0 0 auto;cursor:pointer}
#fx{position:absolute;inset:0;width:100%;height:100%}
.hmeta{flex:1;min-width:0}
.hname{font:650 10px/1 var(--mono);letter-spacing:4.2px;color:var(--ac);
  text-transform:uppercase;transition:color .8s;display:flex;align-items:center;gap:7px}
.hname::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.4}
.hline{font-size:14px;font-weight:530;line-height:1.3;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hclock{font:400 10.5px/1.45 var(--mono);color:var(--mut);text-align:right;flex:0 0 auto}
#hago{color:var(--faint)}
#sync{position:relative;width:34px;height:34px;flex:0 0 auto;padding:0;border-radius:50%;
  cursor:pointer;border:1px solid var(--line2);background:rgba(255,255,255,.04);
  color:var(--ac);display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,color .2s,transform .12s}
#sync svg{width:16px;height:16px;display:block}
#sync:active{transform:scale(.9)}
#sync.spin svg{animation:spin .8s cubic-bezier(.5,.1,.4,.9) infinite}
#sync.ok{color:var(--grn);border-color:var(--grn)}
#sync.bad{color:var(--red);border-color:var(--red)}
#sync.stale::after{content:"";position:absolute;top:0;right:0;width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 2px #04060a}
@keyframes spin{to{transform:rotate(360deg)}}

/* telemetry strip */
.tel{display:flex;gap:0;margin:9px 0 0;font:400 9.5px/1 var(--mono);
  letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
  border-top:1px solid var(--line);padding-top:7px;overflow:hidden}
.tel span{flex:0 0 auto;padding-right:12px;margin-right:12px;border-right:1px solid var(--line);
  white-space:nowrap}
.tel span:last-child{border:0}
.tel b{color:var(--ac);font-weight:600}
.tel .el{color:var(--ac);opacity:.85}

/* ══ tab rail ══ */
nav{position:relative;z-index:20;flex:0 0 auto;margin-top:8px;
  border-bottom:1px solid var(--line)}
.rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 15px}
.rail::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;position:relative;padding:8px 11px 9px;cursor:pointer;
  font:600 9px/1 var(--mono);letter-spacing:1.4px;text-transform:uppercase;
  color:var(--faint);transition:color .25s;background:none;border:0;
  display:flex;flex-direction:column;align-items:center;gap:5px}
.tab svg{width:19px;height:19px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .32s cubic-bezier(.2,.7,.3,1),filter .3s}
.tab.on svg{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 8px var(--tc))}
.tab:active svg{transform:scale(.9)}
.tab .dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;
  background:var(--red);opacity:0;transition:.3s}
.tab.alert .dot{opacity:1}
.tab.on{color:var(--tc)}
.tab.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2px;
  background:var(--tc);box-shadow:0 0 12px var(--tc);border-radius:2px}

/* ══ scroll body ══ */
main{position:relative;z-index:20;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:16px 15px 10px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.wrap{max-width:620px;margin:0 auto}
.pane{display:none}
.pane.on{display:block}
.pane.on > *{animation:flt .62s cubic-bezier(.16,.8,.28,1) both}
.pane.on > *:nth-child(1){animation-delay:.00s}
.pane.on > *:nth-child(2){animation-delay:.045s}
.pane.on > *:nth-child(3){animation-delay:.09s}
.pane.on > *:nth-child(4){animation-delay:.13s}
.pane.on > *:nth-child(5){animation-delay:.17s}
.pane.on > *:nth-child(6){animation-delay:.21s}
.pane.on > *:nth-child(7){animation-delay:.245s}
.pane.on > *:nth-child(8){animation-delay:.28s}
.pane.on > *:nth-child(9){animation-delay:.31s}
.pane.on > *:nth-child(n+10){animation-delay:.34s}
@keyframes flt{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(3px)}
  to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){ .pane.on > *{animation:none} }

/* ══ HUD primitives ══ */
.eyebrow{font:600 9.5px/1 var(--mono);letter-spacing:2.6px;text-transform:uppercase;
  color:var(--ac);display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.pane > .eyebrow:first-child{margin-top:0}
.eyebrow .ln{flex:1;height:1px;background:var(--line)}
.eyebrow .c{color:var(--faint);letter-spacing:1.4px;flex:0 0 auto}
.eyebrow .rd{color:var(--faint);letter-spacing:1.4px;flex:0 0 auto;cursor:pointer;
  border:1px solid var(--line);padding:4px 9px}
.eyebrow .rd:active{color:var(--ac);border-color:var(--ac)}

.card{position:relative;background:var(--panel);border:1px solid var(--line);
  padding:14px 15px;margin-bottom:9px;cursor:pointer;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:.18s}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;
  border:1px solid var(--cc,var(--ac));opacity:.65;transition:.2s}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card:active{background:rgba(255,255,255,.06)}
.card.on{border-color:var(--line2);background:rgba(255,255,255,.055)}
.card.on::before,.card.on::after{width:15px;height:15px;opacity:1}
.card .k{font:600 9px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;
  color:var(--cc,var(--ac));opacity:.85;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.card .k i{font-style:normal;color:var(--faint);letter-spacing:1.2px}
.card .t{font-size:14.5px;font-weight:550;line-height:1.38}
.card .d{display:none;font-size:13.5px;line-height:1.65;color:var(--mut);margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.card.on .d{display:block}

/* countdown rail */
.strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:14px;margin:0 -15px;padding-left:15px;padding-right:15px}
.strip::-webkit-scrollbar{display:none}
.ev{flex:0 0 auto;width:134px;min-height:112px;padding:11px 12px 12px;cursor:pointer;position:relative;
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.ev::before{content:"";position:absolute;top:-1px;left:-1px;width:22px;height:2px;background:var(--evc)}
.ev b{font:300 30px/.9 var(--mono);color:var(--evc);letter-spacing:-1px}
.ev i{font:600 8.5px/1 var(--mono);font-style:normal;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--faint);margin-left:5px}
.ev .n{font-size:12px;font-weight:560;margin-top:9px;line-height:1.32;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .w{font:400 9.5px/1.3 var(--mono);color:var(--faint);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* big stat block */
.stat{display:flex;align-items:baseline;gap:9px;padding:12px 0 11px;border-bottom:1px solid var(--line)}
.stat .v{font:200 34px/1 var(--mono);letter-spacing:-1.4px;color:var(--ac);flex:0 0 auto}
.stat .u{font:600 10px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.stat .r{margin-left:auto;text-align:right;font:400 9.5px/1.4 var(--mono);color:var(--mut);flex:1 1 auto;padding-left:8px}

/* progress meter */
.meter{margin:14px 0 4px}
.meter .lab{display:flex;justify-content:space-between;font:600 9.5px/1 var(--mono);
  letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.meter .lab b{color:var(--ac);font-weight:600}
.meter .track{height:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--ac);
  box-shadow:0 0 14px var(--ac);transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.meter .ticks{display:flex;justify-content:space-between;margin-top:6px;
  font:400 9px/1 var(--mono);color:var(--faint)}

/* idea block */
.idea{position:relative;padding:20px 17px;margin-bottom:14px;
  background:linear-gradient(160deg,rgba(255,200,106,.09),rgba(255,255,255,.02));
  border:1px solid rgba(255,200,106,.2);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.idea::before{content:"";position:absolute;top:-1px;left:-1px;width:32px;height:32px;
  border-left:1px solid var(--gold);border-top:1px solid var(--gold)}
.idea .dt{font:600 9px/1 var(--mono);letter-spacing:2.4px;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px}
.idea .h{font-size:19px;font-weight:600;line-height:1.28;letter-spacing:-.2px}
.idea .b{font-size:14px;line-height:1.68;color:var(--mut);margin-top:12px}
.idea .step{margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,200,106,.22);
  font-size:13.5px;line-height:1.55}
.idea .step em{font-style:normal;font:600 9px/1 var(--mono);letter-spacing:2.2px;
  text-transform:uppercase;color:var(--gold);display:block;margin-bottom:7px}

.why{font:400 11.5px/1.5 var(--mono);color:var(--faint);margin:-6px 0 11px;letter-spacing:.3px}
.take{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);color:var(--ink);font-size:13.5px;line-height:1.55}
.take em{font-style:normal;font:600 9px/1 var(--mono);letter-spacing:2.2px;text-transform:uppercase;
  color:var(--ac);display:block;margin-bottom:7px}

/* the canon */
.canon{border-top:1px solid var(--line)}
.cn{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cn .j{font:600 11.5px/1.35 var(--mono);letter-spacing:.4px;color:var(--ink);flex:0 0 auto;max-width:52%}
.cn .q{font:400 10.5px/1.4 var(--mono);color:var(--faint);text-align:right;flex:1 1 auto;letter-spacing:.2px}

/* topic chips */
.tp{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.tpc{background:var(--panel);border:1px solid var(--line);color:var(--mut);
  padding:9px 14px;font:500 12px/1 -apple-system,sans-serif;cursor:pointer;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.tpc:active{border-color:var(--ac);color:var(--ac)}

.empty{padding:34px 0;text-align:center;color:var(--faint);
  font:400 12.5px/1.7 var(--mono);letter-spacing:.6px}

/* ══ footer ══ */
footer{position:relative;z-index:20;flex:0 0 auto;
  padding:9px 15px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(4,6,10,.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.fw{max-width:620px;margin:0 auto}
.qk{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.qk::-webkit-scrollbar{display:none}
.qc{flex:0 0 auto;background:rgba(255,255,255,.04);border:1px solid var(--line);
  color:var(--mut);padding:7px 12px;font:500 11.5px/1 var(--mono);letter-spacing:.6px;
  cursor:pointer;white-space:nowrap}
.qc:active{border-color:var(--ac);color:var(--ac)}
.bar2{display:flex;align-items:center;gap:8px}
.mic{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ac);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.18s}
.mic.rec{border-color:var(--red);color:var(--red);box-shadow:0 0 22px rgba(255,122,107,.45);
  animation:rec 1.1s ease-in-out infinite}
@keyframes rec{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
input[type=text]{flex:1;background:rgba(255,255,255,.045);border:1px solid var(--line);
  padding:12px 13px;color:var(--ink);font-size:14.5px;font-family:inherit;outline:none;min-width:0}
input[type=text]:focus{border-color:var(--ac)}
.send{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line2);cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--ac);font-size:16px;
  display:flex;align-items:center;justify-content:center}
.send:active{background:rgba(255,255,255,.1)}
.tools{display:flex;gap:11px;justify-content:center;align-items:center;padding-top:9px;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  font:400 9px/1 var(--mono);letter-spacing:.4px}
.tools::-webkit-scrollbar{display:none}
.tool{color:var(--faint);cursor:pointer;flex:0 0 auto;white-space:nowrap}
.tool.act{color:var(--ac)}
.tool.pick{color:var(--ac);border:1px solid var(--line2);padding:4px 9px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:70;opacity:0;pointer-events:none;
  background:rgba(10,13,18,.96);border:1px solid var(--line2);padding:9px 16px;
  font:500 11.5px/1 var(--mono);letter-spacing:.8px;color:var(--ink);
  transition:opacity .25s,transform .25s;max-width:82vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

#ptr{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translate(-50%,0);
  z-index:15;font:600 9.5px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;
  color:var(--ac);background:rgba(4,6,10,.9);border:1px solid var(--line2);padding:6px 14px;
  opacity:0;pointer-events:none;transition:opacity .15s}

/* ══ the launch ══ */
#boot{position:fixed;inset:0;z-index:100;background:#04060a center/cover no-repeat;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .55s ease, visibility .55s}
#boot > *{transition:opacity .38s ease, transform .55s cubic-bezier(.4,0,.2,1)}
#boot.out > *{opacity:0;transform:scale(1.08)}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#bootBox{position:relative;width:min(76vw,300px);height:min(76vw,300px)}
#bfx{position:absolute;inset:0;width:100%;height:100%}
#bname{margin-top:26px;font:650 15px/1 var(--mono);letter-spacing:16px;
  text-indent:16px;color:var(--amber);display:flex}
#bname span{opacity:0;transform:translateY(6px);animation:bin .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bin{to{opacity:1;transform:none}}
#bsub{margin-top:15px;font-size:14.5px;font-weight:500;color:var(--ink);
  opacity:0;transition:opacity .9s ease}
#bsub.on{opacity:1}
#blog{margin-top:26px;min-height:52px;font:400 9.5px/1.9 var(--mono);
  letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);text-align:center}
#blog div{opacity:0;animation:bin .5s ease forwards}
#blog b{color:var(--amber);font-weight:400}
#bskip{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));
  font:400 9px/1 var(--mono);letter-spacing:2.4px;text-transform:uppercase;
  color:rgba(255,255,255,.22)}
#bscan{position:absolute;left:0;right:0;height:1px;top:0;
  background:linear-gradient(90deg,transparent,rgba(255,222,186,.5),transparent);
  animation:bscan 2.6s cubic-bezier(.4,0,.2,1) 2 forwards}
@keyframes bscan{0%{top:12%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:88%;opacity:0}}
#boot.out > #bsub.on,#boot.out > #bname,#boot.out > #blog{opacity:0;transform:scale(1.08)}

/* ══ home ══ */
.hero{text-align:center;padding:4px 0 22px}
.hero .d{font:400 9.5px/1 var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--faint)}
.hero .l{font-size:23px;font-weight:300;line-height:1.28;margin-top:11px;letter-spacing:-.3px}
.hero .l b{font-weight:600;color:var(--ac)}
.hero .wx{margin-top:13px;font:400 10.5px/1 var(--mono);letter-spacing:.9px;white-space:nowrap;
  text-transform:uppercase;color:var(--mut);cursor:pointer;
  display:inline-block;border:1px solid var(--line);padding:7px 13px}
.hero .wx:active{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{position:relative;padding:15px 14px 16px;cursor:pointer;min-height:112px;
  background:var(--panel);border:1px solid var(--line);overflow:hidden;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:flex;flex-direction:column;justify-content:space-between;transition:.18s}
.tile::before{content:"";position:absolute;top:-1px;left:-1px;width:26px;height:26px;
  border-left:1px solid var(--tc);border-top:1px solid var(--tc);opacity:.8}
.tile::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:var(--tc);
  opacity:.25;transform:scaleX(.28);transform-origin:left;transition:.4s}
.tile:active{background:rgba(255,255,255,.06)}
.tile:active::after{transform:scaleX(1);opacity:.7}
.tile.wide{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.tile .n{font:600 9.5px/1 var(--mono);letter-spacing:2.6px;text-transform:uppercase;color:var(--tc)}
.tile .v{font:200 30px/1 var(--mono);letter-spacing:-1.4px;color:var(--ink);margin-top:14px}
.tile.wide .v{margin-top:0;font-size:20px}
.tile .s{font-size:11.5px;line-height:1.35;color:var(--mut);margin-top:6px}
.tile.wide .s{margin-top:2px;flex:1}

/* ══════════ THE SKY ══════════
   Two pre-rendered parallax layers per tab plus a live dust pass. Rendering the
   nebulae once and blitting them means a phone does two image draws a frame,
   not ten thousand gradient fills. The photographic plate, when one exists,
   sits under all of it and the grade sheet keeps the text legible over it. */
const sky=document.getElementById('sky'), sctx=sky.getContext('2d');
let SW=0,SH=0,SDPR=Math.min(devicePixelRatio||1,1.35);
const LAYER={};              // tab key -> {far, near}
let drift=0, scrollY=0, tiltX=0, tiltY=0;

function rnd(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; }

function buildLayers(t){
  const W=Math.ceil(SW*1.18), H=Math.ceil(SH*1.18);
  const mk=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; return c; };
  const R=rnd(t.k.split('').reduce((a,ch)=>a+ch.charCodeAt(0),7)*9176);

  /* far: deep wash, nebula bodies, dense fine stars */
  const f=mk(), fc=f.getContext('2d');
  /* no opaque base here — it is painted per frame only when there is no
     photograph behind, so that his plates are not buried under my sky */
  for(let i=0;i<5;i++){                                     // nebula bodies
    const x=W*(.15+R()*.8), y=H*(.28+R()*.72), r=Math.max(W,H)*(.24+R()*.42);
    const g=fc.createRadialGradient(x,y,0,x,y,r);
    const col = i%2 ? t.s : t.g, a=.055+R()*.075;
    g.addColorStop(0,`rgba(${col},${a})`);
    g.addColorStop(.45,`rgba(${col},${a*.42})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    fc.fillStyle=g; fc.beginPath(); fc.ellipse(x,y,r,r*(.52+R()*.5),R()*3.14,0,6.283); fc.fill();
  }
  for(let i=0;i<520;i++){                                   // far stars
    const x=R()*W, y=R()*H, s=R();
    const a=.10+s*s*.42, rr=s>.94?1.5:s>.7?1.05:.75;
    fc.fillStyle=`rgba(${s>.86?t.g:'214,224,255'},${a})`;
    fc.beginPath(); fc.arc(x,y,rr,0,6.283); fc.fill();
  }

  /* near: a few bright stars with bloom, and one long horizon glow */
  const n=mk(), nc=n.getContext('2d');
  const hy=H*(.80+R()*.10), hg=nc.createLinearGradient(0,hy-H*.20,0,hy+H*.10);
  hg.addColorStop(0,'rgba(0,0,0,0)');
  hg.addColorStop(.62,`rgba(${t.g},.13)`);
  hg.addColorStop(1,'rgba(0,0,0,0)');
  nc.fillStyle=hg; nc.fillRect(0,hy-H*.20,W,H*.30);
  for(let i=0;i<26;i++){
    const x=R()*W, y=R()*H, r=1.4+R()*1.8;
    const g=nc.createRadialGradient(x,y,0,x,y,r*8);
    g.addColorStop(0,'rgba(255,255,255,.9)');
    g.addColorStop(.16,`rgba(${t.g},.5)`);

function paintSky(T){

/* ── touching her is touching water: a ripple from the finger, in screen space ── */
let rip=[];
function touchRipple(x,y,st){
  rip.push({x,y,t:0,s:st||1});
  if(rip.length>5) rip.shift();
  if(typeof pulseFX==='function') pulseFX(.8);
}
function drawRipples(dt){
  if(!rip.length) return;
  const t=TABS.find(x=>x.k===TAB)||TABS[0];
  const prev=sctx.globalCompositeOperation; sctx.globalCompositeOperation='lighter';
  for(const r of rip){
    r.t+=dt;
    const p=r.t/1500;                       // life
    if(p>=1) continue;
    const R0=p*Math.max(SW,SH)*0.78*r.s;
    const fade=(1-p)*(1-p);
    for(let i=0;i<3;i++){
      const rr=R0*(1-i*0.13);
      if(rr<=2) continue;
      const a=fade*(0.20-i*0.055)*r.s;
      if(a<=0.006) continue;
      sctx.beginPath();
      sctx.arc(r.x,r.y,rr,0,6.283);
      sctx.strokeStyle=`rgba(${t.g},${a})`;
      sctx.lineWidth=(2.4-i*0.6)*(1-p*0.5);
      sctx.stroke();
    }
    if(p<0.34){                              // the moment of contact
      const g=sctx.createRadialGradient(r.x,r.y,0,r.x,r.y,60*r.s*(1+p*2));
      g.addColorStop(0,`rgba(${t.g},${(0.34-p)*0.9*r.s})`);
      g.addColorStop(1,`rgba(0,0,0,0)`);
      sctx.fillStyle=g; sctx.beginPath(); sctx.arc(r.x,r.y,60*r.s*(1+p*2),0,6.283); sctx.fill();
    }
  }
  sctx.globalCompositeOperation=prev;
  rip=rip.filter(r=>r.t<1500);
}

let PLACE='Tiruchendur', COORD='8.4956,78.1195';
const WX={ok:false, t:null, feels:null, code:null, hi:null, lo:null, rain:null, text:'', fallback:''};

const WMO={
  0:['clear','Clear'],1:['clear','Mostly clear'],2:['cloud','Partly cloudy'],3:['cloud','Overcast'],
  45:['fog','Fog'],48:['fog','Freezing fog'],
  51:['drizzle','Light drizzle'],53:['drizzle','Drizzle'],55:['drizzle','Heavy drizzle'],
  56:['drizzle','Freezing drizzle'],57:['drizzle','Freezing drizzle'],

  rain:'▓',shower:'░',snow:'❄',storm:'⚡'};

async function loadWeather(){
  const c=String(COORD).split(',').map(x=>parseFloat(x.trim()));
  if(c.length<2 || isNaN(c[0]) || isNaN(c[1])) return false;
  const u='https://api.open-meteo.com/v1/forecast?latitude='+c[0]+'&longitude='+c[1]+
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code'+
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
    '&timezone=auto&forecast_days=1';
  try{
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    const cur=j.current||{}, d=j.daily||{};
    WX.t=Math.round(cur.temperature_2m);
    WX.feels=Math.round(cur.apparent_temperature);
    WX.code=cur.weather_code;
    WX.hi=d.temperature_2m_max?Math.round(d.temperature_2m_max[0]):null;
    WX.lo=d.temperature_2m_min?Math.round(d.temperature_2m_min[0]):null;
    WX.rain=d.precipitation_probability_max?d.precipitation_probability_max[0]:null;
    const w=WMO[WX.code]||['cloud','—'];
    WX.text=w[1]; WX.kind=w[0]; WX.ok=!isNaN(WX.t);
    return WX.ok;
  }catch(e){ WX.ok=false; return false; }
}

/* one short line, or nothing */
function wxLine(){
  if(WX.ok){
    const g=WXGLYPH[WX.kind]||'';
    let s=`${g} ${WX.t}° ${WX.text.toLowerCase()}`;
    /* one extra fact, never two — this has to hold one line on a phone */
    if(WX.rain!=null && WX.rain>=40) s+=` · ${WX.rain}% rain`;
    else if(WX.feels!=null && WX.feels-WX.t>=3) s+=` · feels ${WX.feels}°`;
    else if(WX.hi!=null && WX.lo!=null) s+=` · ${WX.lo}–${WX.hi}°`;
    return s;
  }
  return WX.fallback||'';
}
function wxSpoken(){
  if(WX.ok){
    let s=`It is ${WX.t} degrees in ${PLACE}, ${WX.text.toLowerCase()}`;
    if(WX.feels!=null && WX.feels-WX.t>=3) s+=`, feeling more like ${WX.feels}`;
    if(WX.hi!=null && WX.lo!=null) s+=`. Today runs between ${WX.lo} and ${WX.hi}`;
    if(WX.rain!=null && WX.rain>=35) s+=`, and there is a ${WX.rain} percent chance of rain`;
    return s+'.';
  }
  if(WX.fallback) return `In ${PLACE}, ${WX.fallback}.`;
  return `I couldn't reach the weather just now, Guhan.`;
}
/* ══════════ THE FIVE ELEMENTS ══════════
   Everything that leaves her core is one of five, and which one is leaving is
   how she shows what she feels.

     EARTH   prithvi   glowing dust, spiralling out slowly. Her resting state.
     WATER   jal       rings breaking outward from the centre. Calm, breath, care.
     FIRE    agni      embers climbing and burning down. Encouragement.
     AIR     vayu      fast curved currents streaming outward. Movement, urgency.
     ETHER   akasha    a slow luminous veil, and lightning as its discharge.

   They are never exclusive. Urgency is air with ether cracking through it and a
   little fire underneath; encouragement is fire over earth. Everything is held
   in units of R so the same weather renders correctly in the 52-pixel header
   orb, the breathing overlay and the full-screen launch canvas from one
   simulation. Feeling arrives fast and leaves slowly, the way it does in a

  gr.addColorStop(.62,`rgba(${rgb},.11)`); gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr; g.fillRect(0,0,S,S);

}

function stepFX(dt){

  let na=A*1.5*k; while(na-->0) if(Math.random()<Math.min(1,A*1.5*k)) spawnWind();

  if(B>.55 && Math.random()<B*.10*k) spawnBolt();

  for(const p of motes){ const r=Math.hypot(p.x,p.y)+p.sp*k, a=Math.atan2(p.y,p.x)+p.curl*k;
    p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; p.life-=dt; }
  if(motes.length) motes=motes.filter(p=>p.life>0 && (p.x*p.x+p.y*p.y)<2.30);

  for(const d of drops){ d.r+=d.sp*k; d.life-=dt; }
  if(drops.length) drops=drops.filter(d=>d.life>0 && d.r<1.55);

  for(const p of flames){ p.x+=p.vx*k; p.y+=p.vy*k; p.vy-=.00019*k; p.vx*=.988; p.vy*=.988;
    p.x+=(Math.random()-.5)*.004*k; p.life-=dt*(1+(1-FXV.fire)*.8); }
  if(flames.length) flames=flames.filter(p=>p.life>0);

  for(const w of winds){ w.r+=w.sp*k; w.a+=w.curl*k; w.life-=dt; }
  if(winds.length) winds=winds.filter(w=>w.life>0 && w.r<1.50);

  for(const v of veils){ v.a+=v.sp*k; v.life-=dt; }
  if(veils.length) veils=veils.filter(v=>v.life>0);

  for(const b of bolts) b.life-=dt;
  if(bolts.length) bolts=bolts.filter(b=>b.life>0);
}

/* ── drawn inside drawForm, so every canvas shows the same weather ── */
function drawFX(c,R,glow){
  const A=o=>`rgba(${paA},${o})`, B=o=>`rgba(${paB},${o})`;
  const k=Math.min(1,R/78);
  const AM=.28+k*.72, RM=.50+k*.50, stride=R<26?3:R<46?2:1;
  const prev=c.globalCompositeOperation;
  c.globalCompositeOperation='lighter';

  /* ── ETHER: the veil, furthest out and slowest ── */
  for(const v of veils){
    const t=v.life/v.max, a=(t>.8?(1-t)/.2:Math.min(1,t*2.6))*(.10+glow*.16)*AM*(.4+FXV.ether);
    if(a<=.012) continue;
    c.beginPath(); c.arc(0,0,R*v.r,v.a,v.a+v.span);
    c.strokeStyle=B(a*1.3); c.lineWidth=R*v.w*RM; c.lineCap='round'; c.stroke();
  }

  /* ── AIR: currents streaming outward and curling ── */
  for(let i=0;i<winds.length;i+=stride){
    const w=winds[i], t=w.life/w.max;
    const a=(t>.75?(1-t)/.25:Math.min(1,t*3))*(.30+glow*.40)*AM;
    if(a<=.014) continue;
    c.beginPath();
    for(let s=0;s<=6;s++){
      const f=s/6, ang=w.a-w.curl*f*160, rr=R*(w.r-w.tail*f);
      const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
      s?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.strokeStyle=A(a*1.25); c.lineWidth=w.w*1.5*RM; c.lineCap='round'; c.stroke();
  }

  /* ── EARTH: dust ── */
  const sA=sprite(qrgb(paA)), sB=sprite(qrgb(paB));
  for(let i=0;i<motes.length;i+=stride){
    const p=motes[i], t=p.life/p.max;
    const fade=t>.85?(1-t)/.15:Math.min(1,t*3.2), tw=.55+.45*Math.sin(T*.004+p.ph);
    const rq=p.x*p.x+p.y*p.y, edge=rq>1.30?Math.max(0,1-(rq-1.30)/1.00):1;
    const a=fade*tw*(.34+glow*.5)*(.45+FXV.earth*.85)*AM*edge;
    if(a<=.014) continue;
    const rr=p.s*(1+glow*.5)*3.6*RM;
    c.globalAlpha=a; c.drawImage(p.ph>3.14?sB:sA, p.x*R-rr, p.y*R-rr, rr*2, rr*2);
  }

  /* ── FIRE: embers ── */
  const fH=sprite(FIRE_HOT), fM=sprite(FIRE_MID), fL=sprite(FIRE_LOW);
  for(let i=0;i<flames.length;i+=stride){
    const p=flames[i], t=1-p.life/p.max;
    const rq=p.x*p.x+p.y*p.y, edge=rq>1.30?Math.max(0,1-(rq-1.30)/0.90):1;
    const a=(1-t)*(1-t)*(.62+glow*.42)*AM*.85*edge;
    if(a<=.016) continue;
    const rr=p.s*(1.7-t*.95)*(1+glow*.35)*3.2*RM;
    c.globalAlpha=a; c.drawImage(t<.28?fH:t<.66?fM:fL, p.x*R-rr, p.y*R-rr, rr*2, rr*2);
  }
  c.globalAlpha=1;

  /* ── WATER: rings breaking outward, wobbling as they widen ── */
  for(const d of drops){
    const t=d.life/d.max, a=(t>.85?(1-t)/.15:Math.min(1,t*2.2))*(.26+glow*.30)*AM;
    if(a<=.012) continue;
    c.beginPath();
    for(let s=0;s<=26;s++){
      const ang=s/26*6.283;
      const rr=R*(d.r + Math.sin(ang*3+d.ph+T*.0016)*d.wob*(1-t*.4));
      const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
      s?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.closePath();
    c.strokeStyle=B(a*1.2); c.lineWidth=d.w*1.6*RM;
    if(RM>.8){ c.shadowBlur=12; c.shadowColor=B(.5); } c.stroke(); c.shadowBlur=0;
  }

  /* ── ETHER's discharge: lightning ── */
  for(const b of bolts){
    const t=b.life/b.max, a=Math.min(1,t*1.7);
    if(a<=.03) continue;
    const stroke=(pts,w,col)=>{ c.beginPath();
      for(let i=0;i<pts.length;i++){ const x=pts[i][0]*R, y=pts[i][1]*R; i?c.lineTo(x,y):c.moveTo(x,y); }
      c.strokeStyle=col; c.lineWidth=w; c.lineCap='round'; c.lineJoin='round'; c.stroke(); };
    const LW=Math.max(.45,RM);
    c.shadowBlur=(10+glow*20)*RM; c.shadowColor=A(.85);
    stroke(b.pts, b.w*3.6*(1+glow*.4)*LW, A(a*.30*AM));
    stroke(b.pts, b.w*1.5*LW, `rgba(255,246,232,${a*.95*AM})`);
    for(const f of b.forks){ stroke(f, b.w*2.2*LW, A(a*.22*AM));
      stroke(f, b.w*.9*LW, `rgba(255,246,232,${a*.7*AM})`); }
    c.shadowBlur=0;
  }

  c.globalCompositeOperation=prev;
}
/* ── ASTRA as a living light-form: no face, nothing to contradict the voice ── */
const BINS=110;
const wave=new Float32Array(BINS), waveT=new Float32Array(BINS), wSeed=new Float32Array(BINS);
for(let i=0;i<BINS;i++) wSeed[i]=Math.random()*6.283;
let ripples=[], coreP=0, coreT=0;

function pokeForm(strength){
  const s=Math.max(.25,Math.min(1,strength));
  for(let i=0;i<BINS;i++){
    const lobe=.42+.58*Math.abs(Math.sin(i*.19+wSeed[i]));
    waveT[i]=Math.max(waveT[i], s*lobe*(.55+Math.random()*.65));
  }
  coreT=Math.max(coreT,s);
  if(ripples.length<14) ripples.push({r:.34,a:.55*s});
}

/* filaments that drift around the core */
const fils=Array.from({length:26},(_,i)=>({
  a:Math.random()*6.283, r:.62+Math.random()*.46, len:.5+Math.random()*1.5,
  sp:(Math.random()<.5?-1:1)*(.00012+Math.random()*.00042),
  w:.5+Math.random()*1.3, ph:Math.random()*6.283, tw:.0006+Math.random()*.0016}));

function drawForm(ctx,cx,cy,S,glow){
  const A=(o)=>`rgba(${paA},${o})`, B=(o)=>`rgba(${paB},${o})`;
  const R=S*(breath? .58+bScale*.42 : .80);

  // decay
  for(let i=0;i<BINS;i++){ wave[i]+=(waveT[i]-wave[i])*.26; waveT[i]*=.885; }
  coreP+=(coreT-coreP)*.20; coreT*=.90;
  ripples.forEach(p=>{ p.r+=.011+p.a*.02; p.a*=.968; });
  ripples=ripples.filter(p=>p.a>.02 && p.r<1.9);

  ctx.save(); ctx.translate(cx,cy);

  /* outer aura */
  const au=ctx.createRadialGradient(0,0,R*.15,0,0,R*1.85);
  au.addColorStop(0,B(.13+glow*.13)); au.addColorStop(.45,A(.06+glow*.08)); au.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=au; ctx.beginPath(); ctx.arc(0,0,R*1.85,0,6.283); ctx.fill();

  /* drifting filaments */
  fils.forEach(f=>{
    f.a+=f.sp*(1+glow*2.4);
    const wob=Math.sin(T*f.tw+f.ph)*.10;
    ctx.beginPath();
    for(let t=0;t<=1.001;t+=.08){
      const ang=f.a+t*f.len*(.55+wob), rr=R*(f.r+t*.30+Math.sin(T*f.tw*1.5+f.ph+t*4)*.03);
      const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr*.98;
      t?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle=A(.10+glow*.26); ctx.lineWidth=f.w*(.8+glow*.7); ctx.lineCap='round';
    ctx.shadowBlur=8+glow*16; ctx.shadowColor=A(.4); ctx.stroke(); ctx.shadowBlur=0;
  });

  /* expanding ripples on each word */
  ripples.forEach(p=>{
    ctx.beginPath(); ctx.arc(0,0,R*p.r,0,6.283);
    ctx.strokeStyle=B(p.a*.7); ctx.lineWidth=1.1+p.a*1.6; ctx.stroke();
  });

  /* the voice ring — a closed curve that blooms with speech */
  const amp=R*(.115+glow*.10);
  const ring=(off,alpha,lw,mul)=>{
    ctx.beginPath();
    for(let i=0;i<=BINS;i++){
      const k=i%BINS, ang=k/BINS*6.283-Math.PI/2;
      const idle=Math.sin(T*.0011+wSeed[k]*.7)*.16+Math.sin(T*.0026+k*.35)*.10;
      const rr=R*(1+off) + (wave[k]*mul+idle*.35)*amp;
      const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=alpha; ctx.lineWidth=lw;
    ctx.shadowBlur=16+glow*30; ctx.shadowColor=A(.5); ctx.stroke(); ctx.shadowBlur=0;
  };
  ring(.20, B(.16+glow*.24), 1.0, .55);
  ring(.09, A(.26+glow*.34), 1.3, .82);
  ring(0,   A(.54+glow*.42), 2.0, 1.0);

  /* plasma core */
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<=BINS;i++){
    const k=i%BINS, ang=k/BINS*6.283-Math.PI/2;
    const idle=Math.sin(T*.0011+wSeed[k]*.7)*.16+Math.sin(T*.0026+k*.35)*.10;
    const rr=R+(wave[k]+idle*.35)*amp;
    const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.clip();

  const base=ctx.createRadialGradient(0,-R*.12,R*.05,0,0,R*1.05);
  base.addColorStop(0,A(.60+coreP*.34)); base.addColorStop(.42,A(.20+coreP*.20));
  base.addColorStop(.78,B(.09+coreP*.12)); base.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=base; ctx.fillRect(-R*1.4,-R*1.4,R*2.8,R*2.8);

  for(let i=0;i<4;i++){
    const px=Math.sin(T/(3400+i*1450)+i)*R*.40, py=Math.cos(T/(4100+i*1200)+i*1.7)*R*.36;
    const pr=R*(.34+.16*Math.sin(T/(2600+i*900)));
    const pg=ctx.createRadialGradient(px,py,0,px,py,pr);
    pg.addColorStop(0,(i%2?B:A)(.16+coreP*.22)); pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg; ctx.fillRect(-R*1.4,-R*1.4,R*2.8,R*2.8);
  }
  if(false){
    ctx.globalAlpha=.55;
    const s=Math.max(R*2/portrait.width,R*2/portrait.height)*1.05;
    const w=portrait.width*s,h=portrait.height*s;
    ctx.drawImage(portrait,-w/2,-h/2+Math.sin(T/1900)*2,w,h);
    ctx.globalAlpha=1;
  }
  // slow inner swell
  const sw=R*(.52+.10*Math.sin(T/2600));
  const sg=ctx.createRadialGradient(0,R*.10,0,0,R*.10,sw);
  sg.addColorStop(0,B(.05+glow*.07)); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(-R*1.4,-R*1.4,R*2.8,R*2.8);
  ctx.restore();

  /* the weather she is making — lightning, fire, dust */
  drawFX(ctx,R,glow);

  /* bright nucleus */
  const nr=R*(.13+coreP*.10+(breath?bScale*.05:0));
  const ng=ctx.createRadialGradient(0,0,0,0,0,nr*2.4);
  ng.addColorStop(0,'rgba(255,255,255,'+(.55+coreP*.35)+')');
  ng.addColorStop(.30,A(.62+coreP*.30)); ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(0,0,nr*2.4,0,6.283);
  ctx.shadowBlur=24+coreP*40; ctx.shadowColor=A(.7); ctx.fill(); ctx.shadowBlur=0;

  ctx.restore();
}

/* ══════════ VOICE ══════════ */
let voiceOn=true, VOICE=null;
let VLIST=[];
function rankVoice(v){
  let s=0; const n=v.name;
  if(/premium|enhanced|natural|neural/i.test(n)) s+=60;      // the good ones
  if(/^Google/i.test(n)) s+=34;
  if(/Ava|Samantha|Serena|Allison|Sonia|Libby|Aria|Jenny|Zira|Karen|Moira|Fiona|Tessa|Nicky|Zoe|Isha|Veena|Rishi|Neerja/i.test(n)) s+=26;
  if(/female/i.test(n)) s+=14;
  if(/en-GB/i.test(v.lang)) s+=12; if(/en-IN/i.test(v.lang)) s+=10; if(/en-US/i.test(v.lang)) s+=6;
  if(/compact|eloquence|espeak/i.test(n)) s-=50;             // the robotic ones
  return s;
}
function pickVoice(){
  VLIST=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)).sort((a,b)=>rankVoice(b)-rankVoice(a));
  return VLIST[0]||null;
}

let showAllVoices=false;
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(_){ return []; } }
function openVoices(){
  /* ALWAYS re-ask. iOS hands the list over late and in pieces, so a list cached
     at boot is exactly why a voice downloaded five minutes ago is missing. */
  const raw=allVoices();
  VLIST=(showAllVoices?raw.slice():raw.filter(x=>/^en/i.test(x.lang)))
        .sort((a,b)=>rankVoice(b)-rankVoice(a));
  if(!VOICE && VLIST.length) VOICE=VLIST[0];
  const box=document.getElementById('vlist');
  if(!raw.length){
    box.innerHTML='<div class="vh">This browser hasn\'t handed me any voices yet. Tap the microphone once, close this, and open it again.</div>';
  } else if(!VLIST.length){
    box.innerHTML='<div class="vh">No English voices offered. Turn on <b>show every language</b> below.</div>';
  } else {
    const best=VLIST.filter(v=>PREFERRED.test(v.name)||/premium|enhanced|natural|neural/i.test(v.name));
    const rest=VLIST.filter(v=>best.indexOf(v)<0);
    const row=v=>`<div class="vrow${VOICE&&v.name===VOICE.name?' on':''}" data-vn="${esc(v.name)}">
        <span class="nm">${esc(v.name.replace(/^(Microsoft|Google)\s+/,''))}</span>
        <span class="lg">${esc(v.lang)}</span><span class="tick">&#10003;</span></div>`;
    box.innerHTML =
      (best.length?`<div class="vg">Best on this phone</div>`+best.map(row).join(''):'')+
      (rest.length?`<div class="vg">Everything else</div>`+rest.map(row).join(''):'');
  }
  /* how she speaks — his ear, his call */
  const hb=document.getElementById('hlist');
  if(hb){
    const sl=(id,lab,min,max,val,note)=>`<div class="tune">
        <div class="tl"><span>${lab}</span><b id="${id}v">${val.toFixed(2)}</b></div>
        <input type="range" id="${id}" min="${min}" max="${max}" step="0.01" value="${val}">

      sl('tPitch','Pitch',0.86,1.14,PREF.pitch,'lower or higher overall')+

         <span class="qc" id="tHear">Hear it</span>
         <span class="qc" id="tReset">Back to default</span></div>`;

  /* the honest footer: what this browser actually offered, and a way to see all of it */
  const en=raw.filter(x=>/^en/i.test(x.lang)).length;
  const f=document.getElementById('vdiag');
  if(f) f.innerHTML=`This browser offered <b>${raw.length}</b> voices, <b>${en}</b> of them English.`+
    `<span id="vall">${showAllVoices?'show English only':'show every language'}</span>`;
  document.getElementById('vsheet').classList.add('on');
  bindTuners();
}

/* ══════════ PROSODY — where the feeling comes from ══════════
   A speech engine gives you one flat voice. Emotion is not in the voice,
   it's in what you do to it sentence by sentence: pitch falls as a thought
   completes, rises on a question, lifts on the word that matters, and the
   silences between clauses are as expressive as the clauses. So every
   response is broken into clauses and each clause is given its own rate,
   pitch, volume and the length of the pause that follows it.            */

  neutral:{r:0.99,p:1.00,v:1.00,g:1.00,f:0.085,li:[]},
  urgent: {r:1.06,p:1.05,v:1.00,g:0.70,f:0.055,li:["Look, ","Right, "]},
  bright: {r:1.01,p:1.06,v:1.00,g:0.86,f:0.070,li:["Okay. ","Here's the thing. "]},
  care:   {r:0.87,p:0.965,v:0.93,g:1.55,f:0.115,li:["Listen, ","Okay. "]},
  wry:    {r:0.95,p:1.01,v:0.95,g:1.18,f:0.095,li:["Honestly, ","Look, "]},
  hush:   {r:0.79,p:0.945,v:0.86,g:1.95,f:0.125,li:[]}
};
/* she reads the room: what is being said decides how it is said */
function readFeel(t){
  const s=' '+t.toLowerCase()+' ';
  if(mode==='calm'||/breath|shoulders|wind down|sixty seconds|put the phone down/.test(s)) return 'hush';
  if(/it's late|get some sleep|rest now|none of them need you tonight/.test(s)) return 'care';
  if(/overdue|urgent|today|deadline|slipping|behind|chasing|needs you|no longer optional/.test(s)) return 'urgent';
  if(/well done|proud|you can|keep going|momentum|you've built|brilliant|good work|you are closer/.test(s)) return 'bright';
  if(/honestly|to be fair|of course|as ever|still bothering me/.test(s)) return 'wry';
  return 'warm';
}
/* the words a person leans on */
const STRESS=/\b(only|still|now|today|tomorrow|must|never|always|first|before|biggest|one|actually|really|already|overdue|final|last|urgent|remember)\b/i;
function clauseWeight(c){
  let w=0;
  if(STRESS.test(c)) w+=1;
  if(/\d/.test(c)) w+=1;                       // numbers get said deliberately
  if(/\b[A-Z]{2,}\b/.test(c)) w+=1;            // initialisms
  if(/\bGuhan\b/.test(c)) w+=1;                // his name is said softly, not rattled off
  return w;
}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function planSpeech(text,feelName){
  const clean=normalise(String(text).replace(/<[^>]+>/g,' '));
  const F=FEEL[feelName]||FEEL.warm;
  let sents=(clean.match(/[^.!?…]+[.!?…]*/g)||[clean]).map(s=>s.trim()).filter(Boolean);
  /* a bare "1." is not a sentence — glue list numbers to what they label */
  sents=sents.reduce((a,s)=>{ if(/^\d+[.)]?$/.test(s)&&a.length) a.push(s.replace(/[.)]$/,'')+','); else if(a.length&&/^\d+,$/.test(a[a.length-1])) a[a.length-1]+=' '+s; else a.push(s); return a; },[])
             .reduce((a,s)=>{ if(/^\d+,$/.test(s)) return a; a.push(s); return a; },[]);
  const plan=[];
  sents.forEach((s,si)=>{
    const isQ=/\?\s*$/.test(s), isBang=/!\s*$/.test(s), lastSent=si===sents.length-1;
    /* clause split — commas, semicolons, colons. no lookbehind: older Safari.
       a colon inside a clock time is not a clause break, so hide it first */
    const guard=s.replace(/(\d):(\d)/g,'$1$2');
    let cl=(guard.match(/[^,;:]+[,;:]?\s*/g)||[guard]).map(x=>x.trim().replace(//g,':')).filter(Boolean);
    /* a scrap of a clause is not worth its own breath — glue it on */
    const merged=[];
    cl.forEach(c=>{ if(merged.length && (c.replace(/\W/g,'').length<14 || merged[merged.length-1].replace(/\W/g,'').length<14))
      merged[merged.length-1]+=' '+c; else merged.push(c); });
    cl=merged.length?merged:[s];
    /* one sentence = one pitch arc: starts up, settles down */
    const drift=(Math.random()-.5)*0.045;
    const N=cl.length;
    cl.forEach((c,ci)=>{
      const pos = N>1 ? ci/(N-1) : (N===1?0.55:1);
      const w   = clauseWeight(c);
      const shortC = c.replace(/\W/g,'').length<26;
      const X=PREF.expr;                       // how much shape he wants
      let pitch = PREF.pitch*(F.p*palT.pitch) + (drift - F.f*pos + (Math.random()-.5)*0.022)*X;
      let rate  = PREF.pace*(F.r*palT.rate) * (1 + ((shortC?0.045:0) + (/\d/.test(c)?-0.055:0) - w*0.028)*X)
                                 * (1+(Math.random()*0.05-0.025)*X);
      let vol   = F.v * (pos>0.72 ? 0.955 : 1);
      if(w){ pitch += 0.035*Math.min(w,2)*X; vol = Math.min(1,vol+0.04); }   // lean in
      if(isQ && ci===N-1){ pitch += 0.135*X; rate *= 1-(0.03*X); }            // the question lifts
      if(isBang && ci===N-1){ pitch += 0.05*X; rate *= 1+(0.03*X); vol=Math.min(1,vol+.05); }
      if(lastSent && ci===N-1 && !isQ){ pitch -= 0.05*X; rate *= 1-(0.05*X); }// and the thought lands
      /* silence is expressive too */
      const tail=c.slice(-1);
      let gap = (/[.!?…]/.test(tail) ? 300 : tail===',' ? 145 : /[;:]/.test(tail) ? 210 : 105);
      gap *= F.g * (0.88+Math.random()*0.28) * (0.72+PREF.expr*0.28) / Math.max(.6,PREF.pace);
      const nxt=cl[ci+1]||sents[si+1]||'';
      if(/^(but|still|and yet|however|though|honestly|look|the thing is)\b/i.test(nxt)) gap+=170;  // a beat before the turn
      if(w>=2) gap+=60;
      plan.push({t:c, rate:clamp(rate,.55,1.5), pitch:clamp(pitch,.62,1.6), vol:clamp(vol,.4,1), gap:Math.round(gap), w:w});
    });
  });
  /* a small human lead-in, sometimes — never when she's meant to be soothing */
  if(plan.length>2 && F.li.length && Math.random()<0.28 && !/^(right|so|okay|look|listen|honestly|good morning|good afternoon|good evening|evening|still up)/i.test(plan[0].t)){
    const li=F.li[Math.floor(Math.random()*F.li.length)];
    plan[0].t = li + plan[0].t.charAt(0).toLowerCase() + plan[0].t.slice(1);
    plan[0].rate *= 0.96;
  }
  return plan;
}

let sayQueue=[], sayTimer=null;
function speakChunks(text,feelName){ sayQueue=planSpeech(text,feelName); nextChunk(true); }
function nextChunk(first){
  if(!sayQueue.length){ speaking=false; envT=0; target=VIS.rest; brow=0;
    clearInterval(visTimer); visTimer=null; setStatus('standing by');
    if(typeof restFX==='function') setTimeout(()=>{ if(!speaking) restFX(); },900);
    return; }
  const it=sayQueue.shift(), t=it.t;
  const u=new SpeechSynthesisUtterance(t);
  try{ if(VOICE) u.voice=VOICE; }catch(_){}
  u.rate=it.rate; u.pitch=it.pitch; u.volume=it.vol;
  const words=t.split(/\s+/);
  if(first) u.onstart=()=>{ speaking=true; brow=mode==='boost'?.35:.15; setStatus('speaking','on'); };
  /* the light leans in exactly where the voice does */
  if(it.w){ pokeForm(.55+it.w*.16); fxBurst=Math.min(1,fxBurst+it.w*.22); }
  u.onboundary=(ev)=>{ envT=Math.min(1,.46+Math.random()*.5+it.w*.06);
    let w=''; if(ev&&typeof ev.charIndex==='number'){const m=t.slice(ev.charIndex).match(/^[A-Za-z']+/); if(m)w=m[0];}
    if(!w) w=words.shift()||'';
    if(w) scheduleWord(w, Math.max(170, w.length*70/u.rate));
    if(/[.,!?]/.test(t.charAt((ev&&ev.charIndex||0)-1))) emph=1; };
  u.onend=()=>{ target=VIS.rest; envT=0;
    clearTimeout(sayTimer); sayTimer=setTimeout(()=>nextChunk(false), it.gap); };
  u.onerror=()=>{ speaking=false; target=VIS.rest; setStatus('standing by'); };
  speechSynthesis.speak(u);
}
function speakDevice(text,fl){
  if(!('speechSynthesis' in window)){speaking=false;setStatus('standing by');return;}
  speechSynthesis.cancel(); clearTimeout(sayTimer); sayQueue=[];
  speakChunks(text, fl);
}
function speak(text,feelName){
  if(!voiceOn){speaking=false;setStatus('standing by');return;}
  text = (typeof you==='function') ? you(text) : text;   // say his name, not mine
  const fl = feelName || readFeel(String(text).replace(/<[^>]+>/g,' '));
  applyFX(fl);                    // what she feels, she shows
  try{ speechSynthesis.cancel(); }catch(_){}
  clearTimeout(sayTimer); sayQueue=[];
  if(typeof stopHosted==='function') stopHosted();
  if(typeof hostedAvailable==='function' && hostedAvailable()){
    speaking=true; setStatus('speaking','on');          // she is about to, so the orb wakes now
    speakHosted(text,fl).then(okay=>{ if(!okay){ speaking=false; speakDevice(text,fl); } });
    return;
  }
  speakDevice(text,fl);
}
function speakSoft(t){ if(!voiceOn) return; const u=new SpeechSynthesisUtterance(t);
  try{ if(VOICE)u.voice=VOICE; }catch(_){}
  u.rate=.74+Math.random()*.05; u.pitch=.93+(Math.random()-.5)*.03; u.volume=.9; speechSynthesis.speak(u); }

/* ══════════ HER REAL VOICE ══════════
   The phone's synthesiser has a ceiling and we reached it. When the hosted
   voice is available she speaks generated audio instead: a whole passage sent
   with a direction for how to deliver it, rather than clauses I have to fake
   prosody onto. Her light is then driven by the actual waveform, so what you
   see is what you hear rather than a guess.

   If there is no signal, no key installed, or anything at all goes wrong, she
   falls back to the device voice mid-sentence and never tells you twice. */

const HOSTED_URL = (new URLSearchParams(location.search).get('say')) || '/api/say';
const HOSTED_VOICES = [
  ['coral',   'Coral',   'warm, expressive — the one I would choose'],
  ['sage',    'Sage',    'calm and measured, a little lower'],
  ['shimmer', 'Shimmer', 'soft and light'],
  ['nova',    'Nova',    'bright and quick'],
  ['ballad',  'Ballad',  'gentle, unhurried, English'],
  ['verse',   'Verse',   'even and articulate'],
  ['alloy',   'Alloy',   'neutral, almost broadcast'],
  ['ash',     'Ash',     'dry and grounded'],
  ['echo',    'Echo',    'clear, slightly cool'],
  ['fable',   'Fable',   'storytelling warmth'],
  ['onyx',    'Onyx',    'deep, male']
];
let hostedOn = false;                // off unless he ever turns it on himself
let hostedVoice = 'coral';
let hostedState = 'unknown';         // unknown | live | absent
let hostedAudio = null, hostedCtx = null, hostedSrc = null, hostedAnalyser = null, hostedData = null;
let hostedAbort = null;

/* Off by default. He chose not to pay for generated speech, so she does not
   reach for it and there is no round trip before she opens her mouth. The
   plumbing stays, dormant, in case he ever changes his mind — one environment
   variable and one tap in her voice sheet and it wakes up. */
function hostedAvailable(){ return hostedOn && hostedState !== 'absent'; }

/* the orb, driven by the real waveform instead of a guess */
function hostedLevel(){
  if(!hostedAnalyser) return 0;
  hostedAnalyser.getByteTimeDomainData(hostedData);
  let s=0; for(let i=0;i<hostedData.length;i+=4){ const v=(hostedData[i]-128)/128; s+=v*v; }
  return Math.min(1, Math.sqrt(s/(hostedData.length/4))*3.4);
}

function stopHosted(){
  try{ if(hostedAbort) hostedAbort.abort(); }catch(_){}
  hostedAbort=null;
  if(hostedAudio){ try{ hostedAudio.pause(); }catch(_){} hostedAudio.src=''; hostedAudio=null; }
  hostedAnalyser=null;
}

async function speakHosted(text, feel){
  const clean = normalise(String(text).replace(/<[^>]+>/g,' ')).slice(0,900);
  if(!clean) return false;
  stopHosted();
  hostedAbort = new AbortController();
  const t0 = performance.now();
  try{
    const r = await fetch(HOSTED_URL, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({text:clean, feel, voice:hostedVoice}),
      signal: hostedAbort.signal
    });
    if(!r.ok){ if(r.status===503||r.status===403||r.status===404) hostedState='absent'; return false; }
    const buf = await r.blob();
    if(!buf || buf.size < 200) return false;
    hostedState='live';

    const url = URL.createObjectURL(buf);
    const a = new Audio(url); a.preload='auto';
    hostedAudio = a;

    /* wire the waveform to her light */
    try{
      hostedCtx = hostedCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(hostedCtx.state==='suspended') await hostedCtx.resume();
      const src = hostedCtx.createMediaElementSource(a);
      const an = hostedCtx.createAnalyser(); an.fftSize=512;
      hostedData = new Uint8Array(an.fftSize);
      src.connect(an); an.connect(hostedCtx.destination);
      hostedAnalyser = an; hostedSrc = src;
    }catch(_){ hostedAnalyser=null; }        // no analyser is survivable

    speaking = true; setStatus('speaking','on');
    a.onended = ()=>{ speaking=false; envT=0; hostedAnalyser=null;
      URL.revokeObjectURL(url); setStatus('standing by');
      if(typeof restFX==='function') setTimeout(()=>{ if(!speaking) restFX(); },900); };
    a.onerror = ()=>{ speaking=false; hostedAnalyser=null; setStatus('standing by'); };
    await a.play();
    return true;
  }catch(e){
    if(e && e.name==='AbortError') return true;   // we cancelled it on purpose
    return false;
  }
}

/* Two homes, tried in order. If a feed.csv sits beside this page — which is how
   it arrives on GitHub Pages — she reads that: same origin, no CORS, on a CDN,
   and every version of it kept in the repo's history. If there is no such file,
   she falls back to the Google Sheet, which is how she has always worked. A
   ?feed= in the link overrides both and is used alone. Once one answers she
   remembers it and stops trying the other. */
const SHEET_FEED="https://docs.google.com/spreadsheets/d/1PfvsVira82Ci6o06EfmXnGZs_wjGpQ9Gzyr_h_7Htb8/gviz/tq?tqx=out:csv";

  if(q) return [decodeURIComponent(q)];
  if(feedHome) return [feedHome];

function feedURL(){ return feedCandidates()[0]; }

function parseCSV(txt){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1 && r.some(x=>x.trim()));
}

/* the channel address lives in the feed sheet, not in this file, so it can be

function noteReady(){ return /^https:\/\/docs\.google\.com\/forms\//.test(NOTE_FORM) && /^entry\./.test(NOTE_FIELD); }

async function sendNote(text,kind){
  const item={t:text,k:kind||'note',at:new Date().toISOString()};
  if(!noteReady()){ pending.push(item); toast('held — her channel isn\'t open yet'); return false; }

  if(NOTE_EMAIL) body.append('emailAddress', NOTE_EMAIL);   // the form requires it

    await fetch(NOTE_FORM,{method:'POST',mode:'no-cors',body});

async function flushPending(){

  const q=pending.slice(); pending=[];
  for(const it of q){ await sendNote(it.t,it.k); }

function applyFeed(rows){
  const now=[],week=[],ev=[],topic={},lift=[],ideas=[],health=[],learn=[],news=[];
  let updated='',greet='';
  rows.forEach(r=>{
    const k=(r[0]||'').trim().toLowerCase();
    const a=(r[1]||'').trim(), b=(r[2]||'').trim(), c=(r[3]||'').trim();
    if(k==='meta'&&a==='updated') updated=b;
    else if(k==='meta'&&a==='greetline') greet=b;
    else if(k==='meta'&&a==='name'&&b) YOU=b;     // the sheet decides whose she is
    else if(k==='meta'&&a==='noteform'&&b) NOTE_FORM=b;
    else if(k==='meta'&&a==='notefield'&&b) NOTE_FIELD=b;
    else if(k==='meta'&&a==='noteemail'&&b) NOTE_EMAIL=b;
    else if(k==='meta'&&a==='place'&&b) PLACE=b;
    else if(k==='meta'&&a==='coords'&&b) COORD=b;
    else if(k==='meta'&&a==='weather'&&b) WX.fallback=b;
    else if(k==='now')   now.push({t:a,d:b,lvl:c||'warn'});
    else if(k==='week')  week.push({t:a,d:b,lvl:c||'warn'});
    else if(k==='event'&&/^\d{4}-\d{2}-\d{2}$/.test(a)) ev.push({d:a,n:b,w:c});
    else if(k==='topic') topic[a.toLowerCase()]=b;
    else if(k==='lift')  lift.push([a,b]);
    else if(k==='idea'){ const p=b.split(/\s*::\s*/); ideas.push({h:a,b:p[0]||'',s:p[1]||'',d:c}); }
    else if(k==='health')health.push({m:a,v:b,t:c});
    else if(k==='learn'){ const p=b.split(/\s*::\s*/);
      learn.push({st:a.toLowerCase(),h:p[0]||'',b:p[1]||'',k:p[2]||'',src:c}); }
    else if(k==='news'){ const p=b.split(/\s*::\s*/);
      news.push({sc:a.toLowerCase(),h:p[0]||'',b:p[1]||'',src:c}); }
  });
  if(!now.length&&!week.length&&!ev.length&&!ideas.length) return false;
  if(now.length)   KB.now=now;
  if(week.length)  KB.week=week;
  if(ev.length)    KB.events=ev.sort((x,y)=>x.d.localeCompare(y.d));
  if(ideas.length) KB.ideas=ideas;
  if(health.length)KB.health=health;
  if(learn.length) KB.learn=learn;
  if(news.length)  KB.news=news;
  if(updated)      KB.updated=updated;
  if(greet)        KB.greet=greet;
  ['rehab','goals','cv','visa'].forEach(k=>{ if(topic[k]) KB[k]=topic[k]; });
  if(topic.health) KB.health_note=topic.health;
  if(lift.length){ KB.lift=lift; liftI=Math.floor(Math.random()*lift.length); }
  return true;
}

/* ── WHAT REFRESH REALLY MEANS ──
   Pulling the sheet again only helps if the sheet has changed, and the sheet
   only changes when Claude rewrites it. So a deliberate press does two things:
   it re-reads the sheet immediately, and it posts a catch-up request through
   her channel so a real sweep of mail and calendar happens. That second part
   is not instant and she says so rather than pretending. Rate-limited, because
   pressing it four times should not queue four sweeps. */
let lastLite=0, lastDeep=0;
const LITE_GAP=10*60*1000, DEEP_GAP=60*60*1000;

/* Two depths, because they cost very different amounts.

   LITE is the one the refresh button sends and the one you want ninety
   times out of a hundred: mail since the board was written, today and
   tomorrow in the calendar, rewrite what needs you now. No web search,
   no reading, no ideas. Cheap enough to ask for freely.

   DEEP is everything: the full sweep of mail, ninety days of calendar,
   the news verified against real outlets, a fresh idea, the readings,
   and every note you have typed at me since the last one. It costs
   real money, so she asks for it at most once an hour and says so. */
async function askSweep(kind){
  const now=Date.now();
  if(kind==='deep'){ if(now-lastDeep<DEEP_GAP) return false; }
  else             { if(now-lastLite<LITE_GAP) return false; }
  const body = kind==='deep'
    ? 'Guhan asked for a DEEP sweep. Everything: all mail since the board was written and anything from the past month still awaiting his reply, ninety days of calendar, the news rewritten and verified, a new idea, the readings if it is Monday, and every note he has sent me. Rewrite the whole board.'
    : 'Guhan asked for a LITE sweep. Mail since the board was written and today and tomorrow in the calendar only. Rewrite the now and week rows and set meta updated. Do not touch news, ideas, readings or topics, and do not web search. Keep it quick.';
  const ok=await sendNote(body,kind);
  if(ok){
    if(kind==='deep') lastDeep=now; else lastLite=now;

async function refreshNow(loud){
  if(syncing) return false;
  syncing=true;
  const btn=document.getElementById('sync');
  if(btn){ btn.classList.remove('ok','bad'); btn.classList.add('spin'); }
  const before=new Set([...KB.now,...KB.week].map(x=>x.t));
  const beforeIdea=KB.ideas[0]?KB.ideas[0].h:'';
  const ok=await loadFeed();
  await loadWeather();
  paintAll();
  if(btn){ btn.classList.remove('spin'); btn.classList.add(ok?'ok':'bad');
    setTimeout(()=>btn.classList.remove('ok','bad'),2400); }
  if(ok) lastSync=Date.now();
  agoTick(); syncing=false;
  if(!loud) return ok;

  if(!ok){ respond(`<b>I couldn't reach my feed just then, Guhan.</b><br><br>I'm still working from what I already had. It's usually signal — try me again in a moment.`,
      `I couldn't reach my feed just then, Guhan. I'm still working from what I already had. It's usually signal. Try me again in a moment.`,'care');
    return false; }

  const fresh=[...KB.now,...KB.week].filter(x=>!before.has(x.t));
  const newIdea=KB.ideas[0]&&KB.ideas[0].h!==beforeIdea;
  const t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

  /* ask for a real sweep behind the scenes, then tell him the truth about it */
  const swept=await askSweep('lite');
  const sweepHtml=swept
    ? `<br><br><span style="color:var(--mut)">I've also asked for a quick sweep, your mail and today's calendar, back to when this board was written.</span>`
    : '';
  const sweepSay=swept
    ? ` I have also asked for a quick sweep of your mail and today's calendar, back to when this board was written.`
    : '';

  if(fresh.length){
    const head=fresh.slice(0,3);
    respond(`<b>Caught up as of ${t}.</b><br><br>${fresh.length} new since I last looked.<br><br>`+
      head.map(x=>`<b>${esc(x.t)}</b><br><span style="color:var(--mut)">${esc(x.d)}</span>`).join('<br><br>')+
      (newIdea?`<br><br>And there's a new idea waiting in the Ideas tab.`:'')+sweepHtml,
      `Caught up as of ${t}, Guhan. ${fresh.length} new thing${fresh.length===1?'':'s'} since I last looked. `+
      head.map(x=>`${x.t}. ${x.d}`).join(' ')+(newIdea?` And there is a new idea waiting for you.`:'')+sweepSay,'urgent');
  } else if(newIdea){
    setTab('ideas');
    respond(`<b>Nothing new on the board, but there's a new idea.</b><br><br>${esc(KB.ideas[0].h)}`+sweepHtml,
      `Nothing new on the board, Guhan, but there is a new idea. ${KB.ideas[0].h}`+sweepSay,'bright');
  } else if(!feedIsToday()){
    /* the honest case: the sheet has not been rewritten since before today */
    respond(`<b>Nothing had changed on the sheet, Guhan.</b><br><br>`+
      `This board was written ${esc(KB.updated)}, so anything that arrived after that was never on it.`+
      (swept
        ? `<br><br>I've asked for a sweep now, mail and today's calendar, everything since then. Say <b>deep sweep</b> if you want the news, the reading and a new idea rewritten too.`
        : `<br><br>I asked for a sweep a few minutes ago, so one is already on its way.`),
      `Nothing had changed on the sheet, Guhan. This board was written ${KB.updated}, so anything that arrived after that was never on it. `+
      (swept
        ? `I have asked for a sweep now, your mail and today's calendar, everything since then. Say deep sweep if you want the news, the reading and a new idea rewritten too.`
        : `I asked for a sweep a few minutes ago, so one is already on its way.`),'care');
  } else {
    respond(`<b>Nothing new, Guhan.</b><br><br>I've just checked. Everything I'm holding is current as of ${esc(KB.updated)}. ${KB.now.length} still need you today.`+sweepHtml,
      `Nothing new, Guhan. I've just checked. Everything I'm holding is current, and ${KB.now.length} thing${KB.now.length===1?'':'s'} still need${KB.now.length===1?'s':''} you today.`+sweepSay,'warm');
  }
  return true;
}

function handle(q){
  q=String(q||'').trim(); if(!q) return;
  bubble(q,true);                       // what he said, kept alongside what she said
  const r=ROUTES.find(([re])=>re.test(q));
  if(r){ r[1](q); return; }
  /* anything she doesn't recognise is treated as something he's telling her,
     not as a failed command — that is the difference between a menu and an assistant */
  if(q.split(/\s+/).length>=3){ takeNote(q,'note'); return; }
  respond(`I didn't quite catch that one, Guhan. Try <b>brief</b>, <b>urgent</b>, <b>idea</b>, <b>deadlines</b> — or start with <b>note</b> and I'll pass it to Claude.`,
    `I didn't quite catch that one, Guhan. Try brief, urgent, idea, or deadlines. Or start with note, and I'll pass it to Claude.`,'warm');
}

/* ══════════ RENDER LOOP ══════════ */
function loop(ts){
  const dt=Math.min(50,ts-last||16); last=ts; T=ts;
  env+=(envT-env)*.22; envT*=.90; emph*=.93;
  paA=mixc(paA,palT.a,.035); paB=mixc(paB,palT.b,.035);
  tickBreath();
  stepFX(dt);
  if(speaking && typeof hostedLevel==='function' && hostedAnalyser){
    const lv=hostedLevel(); envT=Math.max(envT,lv);
    if(lv>.30 && Math.random()<.34) pokeForm(.35+lv*.7);
  }
  const glow=speaking?Math.max(env,.35):(listening?.34+Math.sin(T/240)*.16:(breath?.18+bScale*.34:.12+Math.sin(T/2100)*.05));
  paintSky(T);
  if(booting){
    if(!bootT0) bootT0=ts;
    const e=Math.min(1,(ts-bootT0)/1900);            // ignition curve
    const ease=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2;
    const S=Math.min(BW,BH)*.40*(0.06+ease*0.94);
    const bg=0.16+ease*0.72+Math.sin(ts/380)*0.05*ease;
    bctx.clearRect(0,0,BW,BH);
    if(e>0.02) drawForm(bctx,BW/2,BH/2,S,bg);
    if(e>0.15 && e<0.9 && Math.random()<0.5) pokeForm(0.2+Math.random()*0.5);
    /* the arrival: dust first, then fire climbing, then two cracks of lightning */
    if(e<0.34)      setFX(0, 0.10+e*1.2, 0.35+e*1.1);
    else if(e<0.80) setFX(0.10, 1.15, 1.05);
    else            { setFX(0.85, 0.75, 1.00); if(Math.random()<0.16) spawnBolt(); }
  }
  ctx.clearRect(0,0,CW,CH);
  drawForm(ctx,CW/2,CH/2,Math.min(CW,CH)*.40,glow);
  if(document.getElementById('zen').classList.contains('on')){
    zctx.clearRect(0,0,ZW,ZH); drawForm(zctx,ZW/2,ZH/2,Math.min(ZW,ZH)*.38,glow); }
  requestAnimationFrame(loop);
}

(function(){

  m.addEventListener('touchcancel',end,{passive:true});
})();

/* ══════════ INPUT ══════════ */

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById('mic'); let rec=null;

  rec=new SR(); rec.lang='en-IN'; rec.interimResults=false;
  rec.onstart=()=>{listening=true;brow=.55;mic.classList.add('rec');setStatus('listening');};
  rec.onend=()=>{listening=false;brow=0;mic.classList.remove('rec');if(!speaking)setStatus('standing by');};
  rec.onresult=e=>handle(e.results[0][0].transcript);
  rec.onerror=e=>{listening=false;mic.classList.remove('rec');setStatus('standing by');
    if(e.error==='not-allowed'||e.error==='service-not-allowed')
      respond(LOCAL?`<b>The microphone is blocked, Guhan — but not by me.</b><br><br>You've opened me as a downloaded file, and browsers restrict the microphone outside <b>https</b>. Everything else works.`
        :`<b>Microphone permission was declined.</b><br><br>Allow it in your browser settings and tap the microphone again.`,null,'care'); };
  mic.onclick=()=>{ if(listening){rec.stop();return;} speechSynthesis.cancel(); speaking=false; try{rec.start()}catch(_){} };
} else mic.onclick=()=>respond(`Voice input needs Chrome or Safari, Guhan. You can type to me instead.`,null,'warm');

tv.onclick=()=>{voiceOn=!voiceOn;tv.textContent=voiceOn?'sound':'muted';tv.classList.toggle('act',voiceOn);

  }

document.getElementById('tx').onclick=closeTalk;
document.getElementById('tgrab').onclick=closeTalk;
document.getElementById('tthread').addEventListener('click',e=>{
  const r=e.target.closest('[data-rp]'); if(!r) return;
  const m=THREAD[+r.dataset.rp]; if(m&&!m.mine) speak(m.spoken||m.html, m.feel);
});
document.getElementById('tStop').onclick=()=>{speechSynthesis.cancel();
  if(typeof stopHosted==='function') stopHosted(); speaking=false;
  if(rec&&listening)rec.stop(); if(breath)stopBreath(); setStatus('standing by');};
function labelVoice(){const el=document.getElementById('tVox'); if(!el)return;
  if(typeof hostedAvailable==='function' && hostedAvailable() && hostedState!=='absent'){
    const h=(typeof HOSTED_VOICES!=='undefined')&&HOSTED_VOICES.find(v=>v[0]===hostedVoice);
    el.textContent=(h?h[1]:hostedVoice)+' \u00b7 real'; return; }
  if(VOICE){const n=VOICE.name.replace(/\s*\(.*\)/,'').replace(/^Microsoft |^Google /,'').slice(0,13);
    el.textContent=n+(VLIST.length>1?' '+(VLIST.indexOf(VOICE)+1)+'/'+VLIST.length:'');}
  else el.textContent='voice';}
[300,900,2000,4000].forEach(d=>setTimeout(()=>{
  if(!VLIST.length||!VOICE) VOICE=pickVoice();
  if(PREF.voice){ const v=VLIST.find(x=>x.name===PREF.voice); if(v) VOICE=v; }
  labelVoice();},d));
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged',()=>{
  const keep=VOICE&&VOICE.name;
  VLIST=(speechSynthesis.getVoices()||[]).filter(x=>/^en/i.test(x.lang)).sort((a,b)=>rankVoice(b)-rankVoice(a));
  VOICE=(keep&&VLIST.find(v=>v.name===keep))||VLIST[0]||VOICE;
  labelVoice();
  if(document.getElementById('vsheet').classList.contains('on')) openVoices();  // redraw it live
});

/* ══════════ NOTIFICATIONS ══════════ */
const VAPID="BCuX1rPrbHdXozBZ0BwHDOddlvd0uWbu89ewakaF7ghRzzIvTDBx0v21q0U2G6-xSvuuBUvtkezGdTXXqMiut6g";
function b64url(s){ const p='='.repeat((4-s.length%4)%4);
  const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
function pushLabel(t){ const el=document.getElementById('tPush'); if(el) el.textContent='notify '+t; }
async function initPush(ask){
  const el=document.getElementById('tPush');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ pushLabel('n/a'); return; }
  let reg;
  try{ reg=await navigator.serviceWorker.register('sw.js'); }catch(e){ pushLabel('n/a'); return; }
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const existing=await reg.pushManager.getSubscription();
  if(existing){ pushLabel('on'); el.classList.add('act'); return; }
  if(!ask){ pushLabel('off'); return; }
  if(/iPad|iPhone|iPod/.test(navigator.userAgent) && !standalone){
    respond(`<b>Almost, Guhan.</b><br><br>On an iPhone I can only send notifications once I'm on your Home Screen. Tap <b>Share</b>, then <b>Add to Home Screen</b>, open me from the icon, and tap this again.`,
      `Almost, Guhan. On an iPhone I can only send notifications once I'm on your home screen. Tap share, then add to home screen, open me from the icon, and tap this again.`,'warm');
    return;
  }
  if(VAPID.indexOf('__')===0){ toast('her key isn\'t installed yet'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ pushLabel('blocked'); return; }
  try{
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64url(VAPID)});
    await sendNote(JSON.stringify(sub),'push-subscription');
    pushLabel('on'); el.classList.add('act');
    respond(`<b>Done, Guhan.</b><br><br>I'll reach you now even when you're not looking — the morning brief, and anything that turns urgent during the day.`,
      `Done, Guhan. I'll reach you now even when you're not looking. The morning brief, and anything that turns urgent during the day.`,'bright');
  }catch(e){ pushLabel('failed'); }
}
document.getElementById('tPush').onclick=()=>initPush(true);
